<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fare — Commands</title><link rel="stylesheet" href="../styles.css"></head><body><header class="nav"><div class="container" style="display:flex;align-items:center;justify-content:space-between;width:100%"><a class="brand" href="../"><img src="../assets/logo.svg">Fare</a><nav class="navlinks"><a href="../">Home</a><a href="../features/">Features</a><a class="active" href="./">Commands</a><a href="../premium/">Premium</a><a href="../ai/">AI</a><a class="nav-cta" href="../dashboard/">Dashboard</a></nav><button class="menu">☰</button></div></header><main class="command-shell container"><div class="section-head"><div><span class="eyebrow">✦ Fare command library</span><h1 style="font-size:clamp(42px,7vw,76px);margin-top:18px">Commands.</h1><p>Search every command and explore Fare by module.</p></div></div><input id="search" class="search" placeholder="Search commands… e.g. antinuke, play, ticket"><div id="tabs" class="tabs"></div><div id="grid" class="command-grid"></div></main><footer class="footer"><div class="container footer-row"><div>Fare · Minimal. Powerful.</div><div class="footer-links"><a href="../">Home</a><a href="https://discord.gg/46Vn9pdtPF">Support</a><a href="https://discord.com/oauth2/authorize?client_id=1514506916993306744&permissions=8&integration_type=0&scope=applications.commands+bot">Invite</a></div></div></footer><script src="../app.js"></script><script>const tabs=document.querySelector('#tabs'),grid=document.querySelector('#grid'),search=document.querySelector('#search');let active='All';Object.keys(items).forEach(k=>{const b=document.createElement('button');b.className='tab';b.textContent=k;b.onclick=()=>{active=k;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};tabs.appendChild(b)});const all=document.createElement('button');all.className='tab active';all.textContent='All';tabs.prepend(all);all.onclick=()=>{active='All';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));all.classList.add('active');render()};function render(){const q=search.value.toLowerCase();grid.innerHTML='';const source=active==='All'?items:{[active]:items[active]};Object.entries(source).forEach(([cat,groups])=>Object.entries(groups).forEach(([name,raw])=>{const cmds=raw.split('|').filter(c=>!q||c.toLowerCase().includes(q)||name.toLowerCase().includes(q)||cat.toLowerCase().includes(q));if(!cmds.length)return;const card=document.createElement('section');card.className='cmd-card';card.innerHTML='<small>'+cat+'</small><h3>'+name+'</h3><div class="cmds">'+cmds.map(c=>'<span class="cmd">,'+c+'</span>').join('')+'</div>';grid.appendChild(card)}));if(!grid.children.length)grid.innerHTML='<div class="notice" style="grid-column:1/-1">No commands found.</div>'}search.addEventListener('input',render);render()</script></body></html>
